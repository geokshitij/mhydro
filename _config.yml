name: Mountain Hydrology Group
description: >
  An independent research collective advancing hydrology and natural-hazard
  science for mountain regions.
url: https://geokshitij.github.io

exclude: [README.md, PHOTOS-NEEDED.md]

# The path structure for blog posts.
permalink: /blog/:year/:month/:day/:title.html

# Sections on the "people" page.
roles:
  - key: member
    name: Members

# Number of news stories on the front page.
front_page_news: 8

# Base pathname for links.
# For a project page at https://geokshitij.github.io/mhydro
# this must be '/mhydro'. If you later move the site to an
# organization root (e.g. https://mountainhydrology.github.io), set this to ''.
base: '/mhydro'

# make pages for the _projects folder
collections:
  projects:
    output: true

# Navigation bar links.
navigation:
  - title: Home
    link: /
  - title: People
    link: /#people
  - title: Research
    link: /research.html
  - title: Publications
    link: /publications.html
  - title: Media
    link: /media.html
