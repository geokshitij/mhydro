<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 175" role="img" aria-label="Infrastructure">
  <defs>
    <linearGradient id="isky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c7d4df"/>
      <stop offset="1" stop-color="#eef1f4"/>
    </linearGradient>
    <linearGradient id="igorge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6fb0d2"/>
      <stop offset="1" stop-color="#2c5f7c"/>
    </linearGradient>
    <linearGradient id="icliff" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55697f"/>
      <stop offset="1" stop-color="#425468"/>
    </linearGradient>
  </defs>
  <rect width="400" height="175" fill="url(#isky)"/>
  <!-- farthest faint peaks -->
  <path d="M120 84 L200 36 L285 84 Z" fill="#b7c6d2" opacity="0.6"/>
  <path d="M0 84 L40 56 L90 84 Z" fill="#b7c6d2" opacity="0.6"/>
  <!-- clouds -->
  <g fill="#ffffff">
    <ellipse cx="60" cy="26" rx="28" ry="8" opacity="0.55"/>
    <ellipse cx="352" cy="34" rx="24" ry="7" opacity="0.45"/>
  </g>
  <!-- distant peaks -->
  <path d="M20 84 L100 22 L185 84 Z" fill="#9fb3c2"/>
  <path d="M100 22 L185 84 L100 84 Z" fill="#8da2b2" opacity="0.8"/>
  <path d="M100 22 L112 35 L104 31 L100 40 L93 32 L86 35 Z" fill="#ffffff"/>
  <path d="M200 84 L290 14 L395 84 Z" fill="#5d7387"/>
  <path d="M290 14 L395 84 L290 84 Z" fill="#4f6278" opacity="0.85"/>
  <path d="M290 14 L303 28 L295 24 L290 33 L283 25 L276 28 Z" fill="#ffffff"/>
  <!-- haze at peak base -->
  <rect x="0" y="70" width="400" height="14" fill="#eef1f4" opacity="0.4"/>
  <!-- river in gorge -->
  <path d="M168 84 L232 84 L222 175 L178 175 Z" fill="url(#igorge)"/>
  <path d="M190 112 q10 -4 20 0" stroke="#d3dde6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <path d="M188 146 q12 -4 22 0" stroke="#d3dde6" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
  <!-- arch reflection -->
  <path d="M186 168 Q200 158 214 168" stroke="#c9563c" stroke-width="3" fill="none" opacity="0.25"/>
  <!-- cliffs -->
  <path d="M0 84 L168 84 L178 175 L0 175 Z" fill="url(#icliff)"/>
  <path d="M232 84 L400 84 L400 175 L222 175 Z" fill="url(#icliff)"/>
  <path d="M168 84 L178 175 L160 175 L154 84 Z" fill="#3a4b5e" opacity="0.55"/>
  <path d="M232 84 L222 175 L240 175 L246 84 Z" fill="#3a4b5e" opacity="0.55"/>
  <!-- rock strata -->
  <g stroke="#36465a" stroke-width="1.6" opacity="0.5">
    <line x1="0" y1="112" x2="150" y2="116"/>
    <line x1="0" y1="140" x2="140" y2="146"/>
    <line x1="252" y1="118" x2="400" y2="112"/>
    <line x1="262" y1="148" x2="400" y2="142"/>
  </g>
  <!-- red arch bridge -->
  <path d="M118 140 Q200 66 282 140" stroke="#c9563c" stroke-width="7" fill="none"/>
  <g stroke="#c9563c" stroke-width="3.6">
    <line x1="136" y1="84" x2="136" y2="124"/>
    <line x1="168" y1="84" x2="168" y2="98"/>
    <line x1="200" y1="84" x2="200" y2="88"/>
    <line x1="232" y1="84" x2="232" y2="98"/>
    <line x1="264" y1="84" x2="264" y2="124"/>
  </g>
  <rect x="100" y="77" width="200" height="7" fill="#c9563c"/>
  <line x1="100" y1="74" x2="300" y2="74" stroke="#a84430" stroke-width="2"/>
  <!-- vehicle on deck -->
  <g>
    <rect x="122" y="70" width="15" height="6" rx="1.5" fill="#3d8bb5"/>
    <rect x="133" y="66.5" width="7" height="4.5" rx="1" fill="#3d8bb5"/>
    <circle cx="126.5" cy="76.8" r="2.2" fill="#2b3a48"/>
    <circle cx="134.5" cy="76.8" r="2.2" fill="#2b3a48"/>
  </g>
  <!-- town on right cliff -->
  <rect x="300" y="52" width="22" height="32" fill="#3d8bb5"/>
  <rect x="328" y="40" width="26" height="44" fill="#2c5f7c"/>
  <rect x="360" y="60" width="18" height="24" fill="#3d8bb5"/>
  <line x1="341" y1="40" x2="341" y2="32" stroke="#2c5f7c" stroke-width="2"/>
  <g fill="#eef1f4">
    <rect x="305" y="58" width="5" height="5"/>
    <rect x="313" y="58" width="5" height="5"/>
    <rect x="305" y="68" width="5" height="5"/>
    <rect x="313" y="68" width="5" height="5"/>
    <rect x="333" y="46" width="5" height="5"/>
    <rect x="342" y="46" width="5" height="5"/>
    <rect x="333" y="56" width="5" height="5"/>
    <rect x="342" y="56" width="5" height="5"/>
    <rect x="333" y="66" width="5" height="5"/>
    <rect x="342" y="66" width="5" height="5"/>
    <rect x="364" y="66" width="4" height="4"/>
    <rect x="371" y="66" width="4" height="4"/>
  </g>
  <!-- transmission tower on left cliff -->
  <g stroke="#e8edf2" stroke-width="2.2" fill="none" stroke-linecap="round">
    <line x1="52" y1="38" x2="42" y2="84"/>
    <line x1="52" y1="38" x2="62" y2="84"/>
    <line x1="40" y1="52" x2="64" y2="52"/>
    <line x1="42" y1="66" x2="62" y2="66"/>
    <line x1="40" y1="52" x2="62" y2="66"/>
    <line x1="64" y1="52" x2="42" y2="66"/>
  </g>
  <!-- dark foreground ledges -->
  <path d="M0 175 L0 158 Q34 152 68 161 L84 175 Z" fill="#2f3d4d"/>
  <path d="M400 175 L400 156 Q364 150 332 161 L318 175 Z" fill="#2f3d4d"/>
</svg>
