# Highlights on the home page. Every block follows the same pattern:
# a title, an optional one-line lead, and a row of up to three 16:9 cards.
#
# Block fields:
#   title:   heading of the block
#   date:    YYYY-MM-DD (optional). Gives the block a shareable link,
#            e.g. /mhydro/#2026-11-20-landslide-runout-and-river-connections-in-nepal
#            Blocks without a date get a link from the title alone.
#   lead:    optional one-line text under the heading
#
# Each highlight also has its own page in highlights/. After adding or renaming
# a highlight, run:  python3 scripts/make_highlight_pages.py
#
# Card fields:
#   kind:    image | video   (default image)
#   src:     image path, or video file for kind: video
#   poster:  still frame shown before a video plays
#   link:    where an image card goes when clicked
#   caption: short text under the card (HTML allowed, links welcome)
# Paths that start with / are prefixed with the site base automatically.
# Keep at most three cards per block so rows line up.

- title: "Landslide runout and river connections in Nepal"
  date: "2026-11-20"
  lead: 'Schmitt, <b>Shikshita Bhandari</b>, Vogl &amp; Marc, <a href="https://doi.org/10.5194/nhess-26-5979-2026"><i>Natural Hazards and Earth System Sciences</i> (2026)</a>. Co-led by group member <b>Shikshita Bhandari</b> (Stanford University). A new framework maps about one million potential landslides in the Kaligandaki Basin, Nepal, and traces where each would run out. Runout enlarges the hazard area by about half, and a third of the landslides connect to rivers.'
  cards:
    - src: /img/highlights/nhess-2026-paper-thumb.jpg
      link: https://doi.org/10.5194/nhess-26-5979-2026
      caption: '<a href="https://doi.org/10.5194/nhess-26-5979-2026">Read the paper</a>'
    - src: /img/highlights/nhess-2026-fig6-thumb.jpg
      link: /img/highlights/nhess-2026-fig6.jpg
      caption: 'About one million potential landslides and their runout paths'
    - src: /img/highlights/nhess-2026-fig10-thumb.jpg
      link: /img/highlights/nhess-2026-fig10.jpg
      caption: 'Buildings and roads exposed to slope failure and runout'

