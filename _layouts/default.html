<!DOCTYPE html>
{% assign target = page.url | replace: 'index.html', '' | prepend: 'https://livingmountains.github.io' %}
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>Moved to Living Mountains Group</title>
        <link rel="canonical" href="{{ target }}">
        <meta name="robots" content="noindex">
        <meta http-equiv="refresh" content="0; url={{ target }}">
        <script>location.replace("{{ target }}" + location.hash);</script>
    </head>
    <body>
        <p>The Mountain Hydrology Group is now <b>Living Mountains Group</b>.
           This page has moved to <a href="{{ target }}">{{ target }}</a>.</p>
    </body>
</html>
